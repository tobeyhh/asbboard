<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administrative Services Bureau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050505;--line:#1f1c14;--line2:#3d3626;--text:#f4efe4;--mute:#9d9584;--blue:#c8a96a;--ice:#e6d3a3;--glow:rgba(200,169,106,.2);
--serif:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--text);font:400 15px/1.55 var(--sans);background:radial-gradient(1000px 520px at 85% -10%,#2b2312 0,transparent 60%),radial-gradient(700px 400px at 0 100%,#16120a 0,transparent 60%),var(--bg);background-attachment:fixed}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(17,15,10,.94),rgba(5,5,4,.97));padding:30px 20px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:14px;padding:0 6px}
.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#322914,#0e0c08);border:1px solid var(--line2);box-shadow:0 0 28px var(--glow),inset 0 1px 0 rgba(255,255,255,.08);color:var(--ice)}
.mark svg{width:24px;height:24px}
.brand b{display:block;font:600 20px/1.15 var(--serif);letter-spacing:0}
.brand span{font-size:12px;color:var(--mute)}
nav{display:flex;flex-direction:column;gap:8px}
.grp{font-size:12px;color:var(--mute);padding:0 6px 6px;font-weight:500}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:13px;cursor:pointer;color:#cfc6b0;font-weight:500;font-size:14px;background:rgba(30,26,18,.45);border:1px solid var(--line);transition:border-color .2s,background .2s,color .2s}
.nav:hover{border-color:var(--line2);color:var(--text);background:rgba(48,41,26,.6)}
.nav[aria-current=page]{background:linear-gradient(135deg,rgba(200,169,106,.2),rgba(30,26,18,.6));border-color:var(--blue);color:#fff;box-shadow:0 0 22px var(--glow)}
.nav:focus-visible,.card:focus-visible,.btn:focus-visible,input:focus-visible,.back:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#3a3018,#17130a);border:1px solid var(--line2);color:var(--ice)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:currentColor;fill-opacity:.16;stroke:none}
.soon{display:flex;align-items:center;gap:13px;padding:11px 12px;border:1px dashed var(--line2);border-radius:13px;color:#6f6753}
.soon .tile{background:transparent;border-style:dashed;color:#6f6753}
.soon small{margin-left:auto;font-size:11px}
main{padding:52px clamp(20px,4vw,60px) 64px;max-width:1160px;width:100%}
h1{font:600 clamp(34px,4.6vw,52px)/1.08 var(--serif);margin:0 0 14px;letter-spacing:-.6px}
.lead{color:var(--mute);margin:0 0 40px;max-width:56ch;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:16px;min-height:230px;padding:26px;border-radius:20px;background:linear-gradient(160deg,#221d12 0,#12100a 55%,#080705 100%);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 40px -24px #000;transition:border-color .25s,box-shadow .25s,transform .25s}
.card:hover{border-color:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 36px var(--glow),0 20px 40px -24px #000;transform:translateY(-3px)}
.card .tile{width:54px;height:54px;border-radius:15px;box-shadow:0 0 24px var(--glow)}
.card .tile svg{width:27px;height:27px}
.card h3{margin:6px 0 0;font:600 21px/1.25 var(--serif);letter-spacing:-.1px}
.card p{margin:0;color:var(--mute);font-size:14px}
.status{margin-top:auto;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#4a4332}
.dot.on{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.panel{display:none}.panel.show{display:block}
.back{all:unset;cursor:pointer;color:var(--mute);font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:28px}
.back:hover{color:var(--text)}.back svg{width:16px;height:16px}
.box{background:linear-gradient(160deg,#19160e,#090806);border:1px solid var(--line2);border-radius:20px;padding:28px;max-width:740px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.box label{display:block;font-size:13px;color:var(--mute);margin-bottom:9px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;background:#080705;border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:13px 15px;font:inherit}
input:focus{border-color:var(--blue);outline:none}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line2);color:var(--text);text-align:center;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:linear-gradient(135deg,#e6d3a3,#c8a96a 55%,#a88a4c);border-color:#d9bd83;color:#14100a;box-shadow:0 0 24px var(--glow)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.note{color:var(--mute);font-size:13px;margin:14px 0 0}
.frame{margin-top:24px;border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:#000;height:70vh;display:none}
.frame iframe{width:100%;height:100%;border:0;background:#000}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 14px;gap:16px}
nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
.nav{white-space:nowrap}.grp,.soon{display:none}
main{padding-top:32px}
}
.bugbtn{all:unset;box-sizing:border-box;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 14px;border-radius:13px;cursor:pointer;font-weight:600;font-size:14px;color:#ecd9a9;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(200,169,106,.14),rgba(200,169,106,.06))}
.bugbtn:hover{border-color:var(--blue);box-shadow:0 0 22px var(--glow)}
.bugbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bugbtn svg{width:19px;height:19px}
dialog{background:linear-gradient(160deg,#19160e,#090806);color:var(--text);border:1px solid var(--line2);border-radius:20px;padding:28px;width:min(540px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 30px 80px #000}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h2{font:600 24px/1.2 var(--serif);margin:0 0 6px}
dialog .lead{margin:0 0 20px;font-size:14px}
dialog .fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
dialog label{font-size:13px;color:var(--mute)}
dialog input,dialog select,dialog textarea{width:100%;min-width:0;flex:none;background:#080705;border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit}
dialog textarea{min-height:120px;resize:vertical}
dialog input:focus,dialog select:focus,dialog textarea:focus{border-color:var(--blue);outline:none}
dialog .actions{margin-top:8px;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="mark" id="logo"></div><div><b>Administrative Services Bureau</b></div></div>
  <nav id="nav" aria-label="Tools"></nav>
  <button class="bugbtn" id="bugOpen"><svg viewBox="0 0 24 24"><path class="f" d="M8 9h8v6a4 4 0 01-8 0V9z"/><path d="M8 9h8v6a4 4 0 01-8 0V9zM9 9a3 3 0 016 0M4 13h4M16 13h4M5 7l3 2M19 7l-3 2M5 19l3-2M19 19l-3-2"/></svg>Report a bug or issue</button>
</aside>
<main>
  <section id="home" class="panel show">
    <h1>Welcome back.</h1>
    <p class="lead">Your desk and paperwork, all in one place.</p>
    <div class="grid" id="grid"></div>
  </section>
  <section id="tool" class="panel">
    <button class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>My tools</button>
    <h1 id="tTitle"></h1>
    <p class="lead" id="tDesc"></p>
    <div class="box">
      <label for="url">Tool link</label>
      <div class="row"><input id="url" type="url" placeholder="Paste the tool's link, e.g. https://you.github.io/tool/"><button class="btn" id="save">Save link</button></div>
      <div class="actions">
        <a class="btn pri" id="open" target="_blank" rel="noopener">Open tool</a>
        <button class="btn" id="embed">Show here</button>
      </div>
      <p class="note" id="msg">Save the link once and it stays on this device.</p>
    </div>
    <div class="frame" id="frame"></div>
  </section>
</main>
</div>
<dialog id="bug" aria-labelledby="bugT">
  <h2 id="bugT">Report a bug or issue</h2>
  <p class="lead">Tell us what went wrong. Your report goes straight to the team.</p>
  <div class="fld"><label for="bName">Your name</label><input id="bName" autocomplete="off" placeholder="Full name"></div>
  <div class="fld"><label for="bType">Type</label><select id="bType"><option>Bug</option><option>Issue</option><option>Suggestion</option></select></div>
  <div class="fld"><label for="bTool">Where did it happen?</label><select id="bTool"></select></div>
  <div class="fld"><label for="bText">What happened?</label><textarea id="bText" maxlength="1500" placeholder="Describe the problem and what you expected to happen."></textarea></div>
  <p class="note" id="bMsg" role="status"></p>
  <div class="actions"><button class="btn" id="bCancel">Cancel</button><button class="btn pri" id="bSend">Send report</button></div>
</dialog>
<script>
// Paste your Discord webhook URL here to receive bug reports.
var WEBHOOK="https://discord.com/api/webhooks/1561789411593683084/3LMCcEJPz4Bl12O7hDjJbgs_KQ6U5mW8jJ71JwOYKqCXMyR8JbD39H1HXgWpq8tCR48w";
// Put a tool's link in "url" below to make it permanent for everyone who opens this dashboard.
var TOOLS=[
 {id:"newsletter",name:"ProTech Newsletter",desc:"Write and format the company newsletter and press releases.",url:"",
  icon:'<path class="f" d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M9 9h6M9 12.5h6M9 16h3"/>'},
 {id:"discipline",name:"Disciplinary & Commendations",desc:"Issue disciplinary notices and commendations with a live preview.",url:"",
  icon:'<path class="f" d="M12 3l7.5 3v5.5c0 4.7-3.2 8-7.5 9.5-4.3-1.5-7.5-4.8-7.5-9.5V6L12 3z"/><path d="M12 3l7.5 3v5.5c0 4.7-3.2 8-7.5 9.5-4.3-1.5-7.5-4.8-7.5-9.5V6L12 3z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/>'},
 {id:"incident",name:"Incident Report Generator",desc:"Turn incident details into a clean, copy-ready report.",url:"https://tobeyhh.github.io/ptincidentreports/",
  icon:'<path class="f" d="M12 3.5l9 16H3l9-16z"/><path d="M12 3.5l9 16H3l9-16z"/><path d="M12 10v4.2M12 17v.01"/>'},
 {id:"feedback",name:"Trainee Feedback Form",desc:"Build Trainee Training Reports with copyable BBCode.",url:"https://tobeyhh.github.io/traineefeedbackform/",
  icon:'<circle class="f" cx="12" cy="8" r="4"/><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.8 3.6-6 7.5-6s6.9 2.2 7.5 6"/><path d="M17.5 3.5l.7 1.4 1.5.2-1.1 1 .3 1.5-1.4-.8-1.4.8.3-1.5-1.1-1 1.5-.2z"/>'},
 {id:"letter",name:"Client Appreciation Letter",desc:"Write a long-term client thank-you letter, ready to present.",url:"https://tobeyhh.github.io/ptal/",
  icon:'<rect class="f" x="3.5" y="6" width="17" height="12.5" rx="2.5"/><rect x="3.5" y="6" width="17" height="12.5" rx="2.5"/><path d="M4 7.5l8 6 8-6"/>'},
 {id:"signature",name:"Signature Generator",desc:"Create your name, rank, division and email signature.",url:"",
  icon:'<path class="f" d="M16.5 3.5l4 4L9 19l-5 1 1-5L16.5 3.5z"/><path d="M16.5 3.5l4 4L9 19l-5 1 1-5L16.5 3.5z"/><path d="M14 6l4 4"/>'}
];
var LOGO='<path class="f" d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6l8-3z"/><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6l8-3z"/><path d="M9 11.5l2.2 2.2L15.5 9"/>';
var HOME='<rect class="f" x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect class="f" x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect class="f" x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect class="f" x="13" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/>';
var store={},cur=null,$=function(i){return document.getElementById(i)};
function get(k){try{return localStorage.getItem(k)||""}catch(e){return store[k]||""}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){store[k]=v}}
function link(t){return get("pt:"+t.id)||t.url}
function svg(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>'}
function build(){
  $("logo").innerHTML=svg(LOGO);
  var n=$("nav");n.innerHTML='<div class="grp">Menu</div>';
  var h=document.createElement("button");h.className="nav";h.dataset.id="home";h.innerHTML='<span class="tile">'+svg(HOME)+'</span>My tools';n.appendChild(h);
  n.onclick=function(){show(null)};
  var g=$("grid");g.innerHTML="";
  TOOLS.forEach(function(t){
    var c=document.createElement("button");c.className="card";
    c.innerHTML='<span class="tile">'+svg(t.icon)+'</span><h3>'+t.name+'</h3><p>'+t.desc+'</p><div class="status"><span class="dot'+(link(t)?" on":"")+'"></span>'+(link(t)?"Ready":"Coming soon")+'</div>';
    c.onclick=function(){go(t)};g.appendChild(c);
  });
  mark();
}
function go(t){var u=link(t);if(u){var a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}else show(t.id)}
function mark(){document.querySelectorAll(".nav").forEach(function(b){b.setAttribute("aria-current","page")})}
function show(id){
  cur=TOOLS.filter(function(t){return t.id===id})[0]||null;
  $("home").classList.toggle("show",!cur);$("tool").classList.toggle("show",!!cur);
  mark();$("frame").style.display="none";$("frame").innerHTML="";
  if(cur){$("tTitle").textContent=cur.name;$("tDesc").textContent=cur.desc;$("url").value=link(cur);$("msg").textContent="Save the link once and it stays on this device.";refresh()}
  window.scrollTo(0,0);
}
function refresh(){
  var u=link(cur),o=$("open");
  if(u){o.href=u;o.style.opacity=1;o.style.pointerEvents="auto"}else{o.removeAttribute("href");o.style.opacity=.4;o.style.pointerEvents="none"}
  $("embed").style.opacity=u?1:.4;
}
$("save").onclick=function(){
  var v=$("url").value.trim();
  if(v&&!/^https?:\/\//i.test(v)){$("msg").textContent="The link must start with https://";return}
  set("pt:"+cur.id,v);build();refresh();$("msg").textContent=v?"Link saved.":"Link cleared.";
};
$("embed").onclick=function(){
  var u=link(cur);if(!u){$("msg").textContent="Save a link first.";return}
  var f=$("frame");f.style.display="block";f.innerHTML="";
  var i=document.createElement("iframe");i.src=u;i.title=cur.name;f.appendChild(i);
  $("msg").textContent="If the tool stays blank here, use Open tool instead.";
};
$("back").onclick=function(){show(null)};
build();
var bug=$("bug");
function bugOpen(){
  var s=$("bTool");s.innerHTML="";
  TOOLS.map(function(t){return t.name}).concat(["Dashboard","Other"]).forEach(function(n){var o=document.createElement("option");o.textContent=n;s.appendChild(o)});
  $("bMsg").textContent="";$("bSend").disabled=false;
  if(bug.showModal)bug.showModal();else bug.setAttribute("open","");
}
$("bugOpen").onclick=bugOpen;
$("bCancel").onclick=function(){bug.close()};
bug.addEventListener("click",function(e){if(e.target===bug)bug.close()});
$("bSend").onclick=function(){
  var n=$("bName").value.trim(),d=$("bText").value.trim(),m=$("bMsg");
  if(!n||!d){m.textContent="Add your name and a description first.";return}
  if(!WEBHOOK){m.textContent="Reporting isn't connected yet. Ask the admin to add the webhook.";return}
  $("bSend").disabled=true;m.textContent="Sending…";
  fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    username:"Staff Directory Reports",allowed_mentions:{parse:[]},
    embeds:[{title:$("bType").value+": "+$("bTool").value,description:d.slice(0,1500),color:0xc8a96a,fields:[{name:"Reported by",value:n.slice(0,100)}],timestamp:new Date().toISOString()}]})})
  .then(function(r){if(!r.ok)throw 0;m.textContent="Report sent. Thank you.";$("bText").value="";setTimeout(function(){bug.close()},1200)})
  .catch(function(){m.textContent="Couldn't send the report. Please try again.";$("bSend").disabled=false});
};
</script>
</body>
</html>
